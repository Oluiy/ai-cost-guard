name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: fitguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Runs the storage/settings tests against real Postgres as well as
      # SQLite; without it the Postgres variants skip.
      FITGUARD_TEST_POSTGRES_URL: postgres://postgres:pw@localhost:5432/fitguard?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./...
      - run: go vet ./...
      # Redis-backed budget tests (RedisEnforcer) skip gracefully without a
      # reachable Redis, but the `redis` service above means they actually
      # run here instead of silently skipping.
      - run: go test ./... -race
