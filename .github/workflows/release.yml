name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Pushing the container image to ghcr.io/oluiy/fitguard.
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser generates the release changelog from git log, which
          # needs full history, not the default single-commit checkout.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # GoReleaser builds one image per architecture with buildx, and
      # pushes to GHCR, so it needs buildx set up and a registry login.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
