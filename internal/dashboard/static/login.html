<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Guard — Log in</title>
<link rel="stylesheet" href="/dashboard/css/dashboard.css" />
<link rel="stylesheet" href="/dashboard/css/login.css" />
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="login-wrap">
  <div class="login-header">
    <div class="brand">
      <span class="mark"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 1.3 20.7 4.6V11.1C20.7 17.1 17 21.3 12 22.9 7 21.3 3.3 17.1 3.3 11.1V4.6Z" fill="#3987e5"/><rect x="9.2" y="8" width="2.4" height="8" rx="1.2" fill="#04101f"/><rect x="12.4" y="8" width="2.4" height="8" rx="1.2" fill="#04101f"/></svg></span>
      <h1>AI Guard</h1>
    </div>
    <button id="theme-toggle" type="button">Toggle theme</button>
  </div>

  <div class="login-card">
    <p class="login-error" id="login-error"></p>
    <form id="login-form">
      <div class="login-field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" required autofocus />
      </div>
      <div class="login-field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button id="login-submit" class="login-submit" type="submit">Log in</button>
    </form>
  </div>

  <p class="login-hint">Forgot your password? Run <code>ai-guard reset-dashboard-password</code> on the server.</p>
</div>
<script src="/dashboard/js/login.js"></script>
</body>
</html>
